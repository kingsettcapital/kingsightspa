# Node.js with Angular
# Build a Node.js project that uses Angular.
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - develop
  - staging
  - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '24.x'
  NPM_VERSION: '8.19.4'
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
    BUILD_CONFIG: 'dev'
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
    BUILD_CONFIG: 'dev'
  ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    BUILD_CONFIG: 'production'

steps:

  - checkout: self
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: $(NODE_VERSION)
    displayName: 'Install Node.js $(NODE_VERSION)'

  - script: npm install -g npm@$(NPM_VERSION)
    displayName: 'Pin npm to $(NPM_VERSION)'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run build:$(BUILD_CONFIG)
    displayName: 'Build ($(BUILD_CONFIG))'

  - task: ArchiveFiles@2
    displayName: 'Archive dist folder'
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: CopyFiles@2
    displayName: 'Copy dist to staging'
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)/dist'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'kingsight'
