<div class="flex flex-col items-center justify-center h-full min-h-screen p-8">
  <h2 class="text-3xl font-semibold text-gray-800 mb-2">Sign in</h2>
  <p class="text-gray-600 mb-6 text-center max-w-md">
    You have been signed out. Sign in with your Microsoft account to continue.
  </p>
  <button
    type="button"
    class="rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
    (click)="signIn()"
  >
    Sign in with Microsoft
  </button>
  <a routerLink="/login-failed" class="mt-4 text-sm text-gray-500 hover:text-gray-700">
    Having trouble signing in?
  </a>
</div>
