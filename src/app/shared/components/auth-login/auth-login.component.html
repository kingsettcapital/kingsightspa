<div class="ks-auth-shell ks-auth-login">
  <app-kingsett-diamond-pattern class="ks-auth-login__diamonds" />
  <app-kingsett-logo variant="secondary" size="lg" />
  <p class="ks-type-subtitle ks-auth-login__product">KingSight — Data Insights</p>
  <h1 class="ks-type-title ks-auth-login__title">Sign in</h1>
  <p class="ks-type-body ks-auth-login__text">
    You have been signed out. Sign in with your Microsoft account to continue.
  </p>
  <button type="button" class="ks-btn ks-btn--primary" (click)="signIn()">
    Sign in with Microsoft
  </button>
  <a routerLink="/login-failed" class="ks-link ks-auth-login__help">Having trouble signing in?</a>
</div>
