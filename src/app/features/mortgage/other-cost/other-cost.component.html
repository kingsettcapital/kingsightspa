<section>
  <h1 class="ks-page__title">Other Cost Capture</h1>
  <p class="ks-page__subtitle">
    Select one or more Loans from the drop down list and or update the Default Status and enter
    any related cost to be tracked
  </p>

  <div class="ks-filter-toolbar">
    <div class="ks-filter-toolbar__filters ks-filter-toolbar__filters--other-cost">
      <div class="ks-filter-toolbar__item ks-filter-toolbar__item--narrow">
        <label class="ks-label" for="loanAlias">Loan Alias</label>
        <ng-select
          id="loanAlias"
          class="ks-ng-select"
          [items]="loanAliasSelectOptions()"
          bindLabel="label"
          bindValue="value"
          [clearable]="true"
          placeholder="Select loan alias..."
          [ngModel]="selectedLoanAlias()"
          (ngModelChange)="updateLoanAlias($event)"
        ></ng-select>
      </div>

      <div class="ks-filter-toolbar__item ks-filter-toolbar__item--narrow">
        <label class="ks-label" for="fundingStatus">Status</label>
        <ng-select
          id="fundingStatus"
          class="ks-ng-select"
          [items]="statusSelectOptions"
          bindLabel="label"
          bindValue="value"
          [multiple]="true"
          [closeOnSelect]="false"
          [clearable]="true"
          placeholder="Select status..."
          [ngModel]="selectedFundingStatuses()"
          (ngModelChange)="updateFundingStatuses($event)"
        ></ng-select>
      </div>
    </div>

    <div class="ks-filter-toolbar__actions">
      <button
        type="button"
        class="ks-btn ks-btn--outline"
        (click)="saveChanges()"
        [disabled]="isSaving() || !hasPendingChanges()"
      >
        Save
      </button>
      <button
        type="button"
        class="ks-btn ks-btn--primary"
        (click)="saveAndUpdate()"
        [disabled]="isSaving() || !hasPendingChanges()"
      >
        Save &amp; Update
      </button>
      <div class="ks-btn-group">
        <div class="ks-tooltip">
          <button
            type="button"
            class="ks-export-btn ks-export-btn--excel"
            (click)="exportExcel()"
            [disabled]="isExporting() || isLoading()"
            aria-label="Export Excel"
          >
            <lucide-icon [img]="excelExportIcon" color="currentColor" [size]="18"></lucide-icon>
          </button>
          <span class="ks-tooltip__label" role="tooltip">Export Excel</span>
        </div>
        <div class="ks-tooltip">
          <button
            type="button"
            class="ks-export-btn ks-export-btn--pdf"
            (click)="exportPdf()"
            [disabled]="isExporting() || isLoading()"
            aria-label="Export PDF"
          >
            <lucide-icon [img]="pdfExportIcon" color="currentColor" [size]="18"></lucide-icon>
          </button>
          <span class="ks-tooltip__label" role="tooltip">Export PDF</span>
        </div>
      </div>
    </div>
  </div>

  <app-data-table
    title="Loan Syndicate Details"
    tableClass="ks-table--other-cost"
    [columns]="tableColumns"
    [data]="tableRows()"
    [sorting]="sorting()"
    [columnFilters]="columnFilters()"
    [columnFilterConfig]="columnFilterConfig"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    loadingMessage="Loading other costs..."
    emptyMessage="No loans found."
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [pageRangeLabel]="pageRangeLabel()"
    [visiblePages]="visiblePages()"
    [rowClassFn]="rowClassFn"
    (sortingChange)="onSortingChange($event)"
    (columnFiltersChange)="onColumnFiltersChange($event)"
    (pagePrevious)="goToPreviousPage()"
    (pageNext)="goToNextPage()"
    (pageSelect)="goToPage($event)"
  >
    <ng-template appDataTableCell="loanId" let-row="row">
      <span class="ks-table__cell--mono ks-table__cell--strong">{{ row.loanId || '—' }}</span>
    </ng-template>

    <ng-template appDataTableCell="loanDescription" let-row="row">
      <span>{{ row.loanDescription }}</span>
    </ng-template>

    <ng-template appDataTableCell="loanAlias" let-row="row">
      <span class="ks-table__cell--strong">{{ row.loanAlias }}</span>
    </ng-template>

    <ng-template appDataTableCell="outstandingInvoices" let-row="row">
      <input
        type="text"
        class="ks-input ks-input--currency"
        [value]="currencyInputValue(row.outstandingInvoices)"
        (input)="updateCostField(row.loanKey, 'outstandingInvoices', $any($event.target).value)"
        [attr.aria-label]="'Outstanding invoices for ' + row.loanAlias"
      />
    </ng-template>

    <ng-template appDataTableCell="estRealizationCosts" let-row="row">
      <input
        type="text"
        class="ks-input ks-input--currency"
        [value]="currencyInputValue(row.estRealizationCosts)"
        (input)="updateCostField(row.loanKey, 'estRealizationCosts', $any($event.target).value)"
        [attr.aria-label]="'Est realization costs for ' + row.loanAlias"
      />
    </ng-template>

    <ng-template appDataTableCell="costToComplete" let-row="row">
      <input
        type="text"
        class="ks-input ks-input--currency"
        [value]="currencyInputValue(row.costToComplete)"
        (input)="updateCostField(row.loanKey, 'costToComplete', $any($event.target).value)"
        [attr.aria-label]="'Cost to complete for ' + row.loanAlias"
      />
    </ng-template>

    <ng-template appDataTableCell="dateDwhUpdate" let-row="row">
      <span class="ks-table__cell--mono">{{ formatDwhDate(row.dateDwhUpdate) }}</span>
    </ng-template>
  </app-data-table>
</section>
