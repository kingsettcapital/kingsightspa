<section class="ks-capital-dashboard portal-shell" aria-label="Capital Dashboard">
  <!-- <header class="ks-capital-dashboard__header">
    <h1 class="ks-capital-dashboard__title">Capital Dashboard</h1>
  </header> -->

  <nav
    mat-tab-nav-bar
    class="ks-capital-dashboard__tabs"
    aria-label="Capital Dashboard sections"
    mat-stretch-tabs="false"
    mat-align-tabs="start"
  >
    <a
      mat-tab-link
      class="ks-capital-dashboard__tab"
      routerLink="./investor"
      [queryParams]="tabClearQueryParams"
      queryParamsHandling="merge"
      replaceUrl="true"
      routerLinkActive
      #investorTab="routerLinkActive"
      [active]="investorTab.isActive"
    >
      <span class="ks-capital-dashboard__tab-label">
        <mat-icon aria-hidden="true" class="ks-tab-icon">person</mat-icon>
        <span class="ks-capital-dashboard__tab-text">Investors</span>
      </span>
    </a>
    <a
      mat-tab-link
      class="ks-capital-dashboard__tab"
      routerLink="./investment"
      [queryParams]="tabClearQueryParams"
      queryParamsHandling="merge"
      replaceUrl="true"
      routerLinkActive
      #investmentTab="routerLinkActive"
      [active]="investmentTab.isActive"
    >
      <span class="ks-capital-dashboard__tab-label">
        <mat-icon aria-hidden="true" class="ks-tab-icon">trending_up</mat-icon>
        <span class="ks-capital-dashboard__tab-text">Investments</span>
      </span>
    </a>
    <a
      mat-tab-link
      class="ks-capital-dashboard__tab"
      routerLink="./asset"
      [queryParams]="tabClearQueryParams"
      queryParamsHandling="merge"
      replaceUrl="true"
      routerLinkActive
      #assetTab="routerLinkActive"
      [active]="assetTab.isActive"
    >
      <span class="ks-capital-dashboard__tab-label">
        <mat-icon aria-hidden="true" class="ks-tab-icon">category</mat-icon>
        <span class="ks-capital-dashboard__tab-text">Assets</span>
      </span>
    </a>
  </nav>

  <router-outlet />
</section>
