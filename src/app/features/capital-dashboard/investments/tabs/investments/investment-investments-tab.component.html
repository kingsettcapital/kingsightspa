<div class="tab-shell">
  <div class="tab-toolbar">
    <div class="ks-investment-investments-search">
      <mat-form-field
        appearance="outline"
        class="ks-investment-investments-search__field"
        subscriptSizing="dynamic"
      >
        <mat-icon matPrefix class="ks-investment-investments-search__icon" aria-hidden="true">search</mat-icon>
        <input
          matInput
          class="ks-investment-investments-search__input"
          type="search"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          placeholder="Search..."
          aria-label="Investments search"
        />
      </mat-form-field>
    </div>

    <mat-button-toggle-group
      class="tab-segment"
      [hideSingleSelectionIndicator]="true"
      [value]="timeframe()"
      (valueChange)="timeframe.set($event)"
      aria-label="Investments timeframe"
    >
      <mat-button-toggle value="ltd">LTD</mat-button-toggle>
      <mat-button-toggle value="quarterly">Quarterly</mat-button-toggle>
      <mat-button-toggle value="daily">Daily</mat-button-toggle>
    </mat-button-toggle-group>

    <mat-form-field
      appearance="outline"
      class="tab-period"
      color="primary"
      subscriptSizing="dynamic"
      floatLabel="always"
    >
      <mat-label>Period</mat-label>
      <mat-select
        [value]="period()"
        (valueChange)="period.set($event)"
        panelClass="tab-period-panel"
        [hideSingleSelectionIndicator]="true"
      >
        <mat-option value="all">All Periods</mat-option>
      </mat-select>
    </mat-form-field>

    <span class="tab-toolbar__spacer"></span>

    <button type="button" mat-stroked-button class="tab-download" (click)="downloadExcel()">
      <mat-icon aria-hidden="true">download</mat-icon>
      <span>Download</span>
    </button>
  </div>

  <div class="detail-table-wrap tab-table-wrap" style="padding-left: 0px; padding-right: 0px;">
    <div class="tab-table-block">
      <div class="tab-table-scroll">
        <table mat-table [dataSource]="rows()" class="detail-table" aria-label="Investments">
      <ng-container matColumnDef="period">
        <th mat-header-cell *matHeaderCellDef class="inner-table-header-cell align-left">Period</th>
        <td mat-cell *matCellDef="let row" class="align-left">{{ row.period }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef class="inner-table-header-cell align-left">Date</th>
        <td mat-cell *matCellDef="let row" class="align-left">{{ row.date }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef class="inner-table-header-cell align-right">Amount</th>
        <td mat-cell *matCellDef="let row" class="align-right">{{ row.amount | ksCurrency }}</td>
      </ng-container>

      <ng-container matColumnDef="units">
        <th mat-header-cell *matHeaderCellDef class="inner-table-header-cell align-right">Units</th>
        <td mat-cell *matCellDef="let row" class="align-right">{{ row.units }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="inner-table-header-cell align-left">Description</th>
        <td mat-cell *matCellDef="let row" class="align-left">{{ row.description }}</td>
      </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns()"></tr>
          <tr mat-row *matRowDef="let row; columns: columns()"></tr>
        </table>
      </div>
    @if (showSummaryFooter()) {
      <div class="tab-table-summary" aria-label="Table totals">
        <span>Total: {{ totalAmount() | ksCurrency }}</span>
        <span class="tab-table-summary__sep" aria-hidden="true">|</span>
        <span>Units: {{ totalUnits() | number: '1.0-0' }}</span>
      </div>
    }
    </div>
  </div>
</div>
