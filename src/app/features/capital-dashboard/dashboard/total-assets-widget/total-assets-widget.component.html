<article class="cdt-dashboard-kpi cdt-dashboard-kpi--blue">
  <p class="cdt-dashboard-kpi__label">Total Assets</p>
  <p class="cdt-dashboard-kpi__value">{{ metric()?.value ?? '—' }}</p>
  @if (metric()?.change) {
    <p
      class="cdt-dashboard-kpi__change"
      [class.cdt-dashboard-kpi__change--positive]="metric()?.changePositive"
      [class.cdt-dashboard-kpi__change--negative]="metric()?.changePositive === false"
    >
      <mat-icon aria-hidden="true">{{ metric()?.changePositive ? 'north_east' : 'south_east' }}</mat-icon>
      {{ metric()?.change }}
    </p>
  }
  @if (metric()?.hint) {
    <p class="cdt-dashboard-kpi__hint">{{ metric()?.hint }}</p>
  }
</article>
