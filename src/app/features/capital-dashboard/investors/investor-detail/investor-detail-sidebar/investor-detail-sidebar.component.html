<nav class="inv-detail-sidebar" aria-label="Investor profile sections">
  @for (section of sections(); track section.title || 'nav') {
    <div class="inv-detail-sidebar__group">
      @if (section.title.trim()) {
        <p class="inv-detail-sidebar__heading">{{ section.title }}</p>
      }
      <ul class="inv-detail-sidebar__list">
        @for (item of section.items; track item.id) {
          <li>
            <button
              type="button"
              class="inv-detail-sidebar__link"
              [class.inv-detail-sidebar__link--active]="activeSectionId() === item.id"
              (click)="sectionSelect.emit(item.id)"
            >
              {{ item.label }}
            </button>
          </li>
        }
      </ul>
    </div>
  }
</nav>
